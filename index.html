<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Slock Labs</title>
    <style>
        body {
            margin: 0;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            background: #0f172a;
            color: #e2e8f0;
            display: flex;
            align-items: center;
            justify-content: center;
            height: 100vh;
            text-align: center;
        }

        .container {
            max-width: 700px;
            padding: 40px;
        }

        h1 {
            font-size: 3rem;
            margin-bottom: 10px;
            letter-spacing: 1px;
        }

        .tagline {
            font-size: 1.2rem;
            color: #94a3b8;
            margin-bottom: 30px;
        }

        .description {
            font-size: 1rem;
            line-height: 1.6;
            color: #cbd5e1;
            margin-bottom: 40px;
        }

        .btn {
            display: inline-block;
            padding: 12px 24px;
            border: 1px solid #334155;
            color: #e2e8f0;
            text-decoration: none;
            transition: all 0.2s ease;
        }

        .btn:hover {
            background: #1e293b;
            border-color: #475569;
        }

        footer {
            position: absolute;
            bottom: 20px;
            width: 100%;
            font-size: 0.8rem;
            color: #64748b;
        }
    </style>
</head>

<body>
    <div class="container">
        <h1>Slock Labs</h1>
        <div class="tagline">Research-driven technology.</div>
        <div class="description">
            We explore, prototype, and build systems-focused technologies.
            Engineering with precision, performance, and long-term thinking.
        </div>
        <a class="btn" href="mailto:hello@slocklabs.com">Contact</a>
    </div>

    <footer>
        © 2026 Slock Labs. All rights reserved.
    </footer>
</body>

</html>
